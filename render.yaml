# Render Blueprint — 중독사회 백엔드 API
# 배포 절차는 docs/DEPLOY-RUNBOOK.md 참고.
# 값이 sync:false인 항목은 Render 대시보드에서 직접 입력한다(비밀값은 파일에 두지 않음).
services:
  - type: web
    name: addiction-society-api
    runtime: node
    region: singapore
    # ⚠️ Free는 15분 무요청 시 슬립 → 매일 09:00 크론이 실행되지 않는다.
    #    발표 감시가 핵심이므로 Starter 이상 필수.
    plan: starter
    rootDir: backend
    # 빌드 시 Node 의존 + (선택) PDF 크론용 Python 의존(pdfplumber)을 확보.
    # pip 미존재/실패해도 배포는 계속된다(|| true) — PDF 크론은 기본 비활성이라 안전.
    # 크론 활성화 전, Render 셸에서 `python3 -c "import pdfplumber"`로 실측 확인할 것.
    buildCommand: >-
      npm ci && npm run build &&
      (pip3 install --user -r ../tools/pdf-extract/requirements-runtime.txt
      || pip install --user -r ../tools/pdf-extract/requirements-runtime.txt
      || echo '[build] pdfplumber 미설치 — PDF 크론 사용 시 런타임에 별도 확보 필요')
    # 빌드 후·기동 전에 매 배포 실행(멱등). 마이그레이션·시딩을 서버가 스스로 수행.
    # Starter+ 에서 동작. 실패 시 배포가 중단되어 구버전이 유지된다.
    preDeployCommand: bash scripts/deploy-init.sh
    startCommand: npm run start:prod
    healthCheckPath: /api/sources/summary
    envVars:
      # 비밀 아님 — 값 직접 명시
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: DB_SSL
        value: "true"
      # 아래는 대시보드에서 입력 (Supabase 접속정보 / 기존 .env 값)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        sync: false
      # 정책 D×P 분석 LLM (DeepSeek, OpenAI 호환). AS-M3-1에서 OPENAI_API_KEY 대체.
      - key: LLM_POLICY_API_KEY
        sync: false
      # Statory 보고서 프록시(분석실 /lab). 학술검색·자동수집 env는 AS-M3-1에서 폐기.
      - key: STATORY_API_URL
        sync: false
      - key: DISCORD_WEBHOOK_OBSERVATORY
        sync: false
    # PORT는 Render가 자동 주입하며 main.ts가 process.env.PORT를 읽는다(별도 지정 불필요).
