# Render Blueprint — 중독사회 백엔드 API
# 배포 절차는 docs/DEPLOY-RUNBOOK.md 참고.
# 값이 sync:false인 항목은 Render 대시보드에서 직접 입력한다(비밀값은 파일에 두지 않음).
services:
  - type: web
    name: addiction-society-api
    runtime: node
    region: singapore
    # ⚠️ Free는 15분 무요청 시 슬립 → 매일 09:00 크론이 실행되지 않는다.
    #    발표 감시가 핵심이므로 Starter 이상 필수.
    plan: starter
    rootDir: backend
    # Node 빌드 + PDF 파서용 Python venv 설치(AS-M3-2c).
    # ⚠️ '|| true' 금지 — 이전엔 실패를 삼켜 pdfplumber 없이 조용히 배포됐다.
    #    이제 설치·import 검증 실패 시 배포가 중단된다(구버전 유지).
    #    PDF 크론이 필요 없으면 env SKIP_PDF_DEPS=true로 명시적으로 건너뛴다.
    buildCommand: npm ci && npm run build && bash scripts/install-pdf-deps.sh
    # 빌드 후·기동 전에 매 배포 실행(멱등). 마이그레이션·시딩을 서버가 스스로 수행.
    # Starter+ 에서 동작. 실패 시 배포가 중단되어 구버전이 유지된다.
    preDeployCommand: bash scripts/deploy-init.sh
    startCommand: npm run start:prod
    healthCheckPath: /api/sources/summary
    envVars:
      # 비밀 아님 — 값 직접 명시
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: DB_SSL
        value: "true"
      # 아래는 대시보드에서 입력 (Supabase 접속정보 / 기존 .env 값)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      # ⚠️ 미설정 시 기동 실패(AS-FIX-1) — 기본 비밀키 폴백을 제거했다.
      - key: JWT_SECRET
        sync: false
      # 회원가입 초대코드(AS-FIX-1, 감사 #1). 비워두면 가입이 완전히 차단된다.
      - key: ADMIN_INVITE_CODE
        sync: false
      - key: JWT_EXPIRES_IN
        sync: false
      # 정책 D×P 분석 LLM (DeepSeek, OpenAI 호환). AS-M3-1에서 OPENAI_API_KEY 대체.
      - key: LLM_POLICY_API_KEY
        sync: false
      # Statory 보고서 프록시(분석실 /lab). 학술검색·자동수집 env는 AS-M3-1에서 폐기.
      - key: STATORY_API_URL
        sync: false
      - key: DISCORD_WEBHOOK_OBSERVATORY
        sync: false
      # PDF 지표 자동추출 크론 스위치. 'true'일 때만 동작(기본 비활성).
      # 감사에서 "코드는 읽는데 render.yaml에 선언이 없어 켜는 방법이 안 보인다"로 지적됨.
      - key: INDICATOR_PDF_CRON_ENABLED
        value: "false"
      # CORS 허용 출처(쉼표 구분). 미설정 시 코드 기본값
      # (addictionsociety.net·www·localhost:3000 + *.vercel.app 프리뷰) 사용.
      - key: CORS_ORIGINS
        sync: false
    # PORT는 Render가 자동 주입하며 main.ts가 process.env.PORT를 읽는다(별도 지정 불필요).
